<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="zfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#zfGrad)"/>
  
  <!-- Outer glowing ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8"/>

  <!-- Industrial grid pattern / warehouse logistics icon -->
  <g transform="translate(106, 85)" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stylized warehouse / box / logistics symbol -->
    <path d="M150 20 L270 85 L270 215 L150 280 L30 215 L30 85 Z" fill="url(#boxGrad)" fill-opacity="0.25" stroke="#ffffff" stroke-width="16"/>
    <path d="M150 20 L150 280" stroke="#ffffff" stroke-width="14"/>
    <path d="M30 85 L150 150 L270 85" stroke="#ffffff" stroke-width="14"/>
    
    <!-- Arrows for operations & transitions -->
    <path d="M80 185 L150 225 L220 185" stroke="#67e8f9" stroke-width="16"/>
  </g>

  <!-- Typography ZF OPERATIVA -->
  <text x="256" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4">ZF OSTROV</text>
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#93c5fd" letter-spacing="6">OPERATIVA PICK</text>
</svg>
